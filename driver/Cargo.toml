[package]
name = "bark-sim-driver"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "noah-public-proof"
path = "../integration/noah-public-proof/src/main.rs"

[features]
default = []
two-step = []

[dependencies]
noah-public-proof = { path = "../integration/noah-public-proof" }
prost = "0.14"
bytes = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", features = ["util"] }
futures = "0.3"
anyhow = "1"
chrono = "0.4"
env_logger = "0.11.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
tonic = { version = "0.14.2", features = ["transport", "tls-native-roots"] }
bitcoin = { version = "0.32.7", features = ["serde", "rand", "rand-std"] }
bip39 = { version = "2", features = ["rand"] }
bark-wallet = { path = "../source/bark", features = ["onchain-bdk"] }
bark-json = { path = "../source/bark-json" }
ark-lib = { path = "../source/lib" }
bark-server-rpc = { path = "../source/server-rpc", features = ["tonic-native"] }

bdk_wallet = "=3.1.0"
bdk_bitcoind_rpc = "=0.22.0"

[dev-dependencies]
bark-bitcoin-ext = { path = "../source/bitcoin-ext" }

[profile.dev]
debug = 0
